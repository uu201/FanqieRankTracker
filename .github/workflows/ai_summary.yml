name: AI Summary Only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 (YYYY-MM-DD)，留空使用各榜单最新快照'
        required: false
        default: ''
        type: string
      board:
        description: '榜单 slug，留空处理全部启用榜单'
        required: false
        default: ''
        type: string
      force:
        description: '强制重新生成已有 AI 总结'
        required: false
        default: true
        type: boolean

jobs:
  ai-summary:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install AI Dependency
      run: python -m pip install --upgrade pip && pip install openai

    - name: Generate AI Summaries
      env:
        TARGET_DATE: ${{ inputs.target_date }}
        BOARD: ${{ inputs.board }}
        FORCE: ${{ inputs.force }}
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}
        API_REQUEST_INTERVAL_SECONDS: ${{ vars.API_REQUEST_INTERVAL_SECONDS || '15' }}
      run: |
        args=()
        if [ "$FORCE" = "true" ]; then
          args+=(--force)
        fi
        if [ -n "$TARGET_DATE" ]; then
          args+=(--date "$TARGET_DATE")
        fi
        if [ -n "$BOARD" ]; then
          args+=(--board "$BOARD")
        fi
        python scripts/build_latest.py "${args[@]}"

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[AI] Update summaries (${{ inputs.target_date || 'latest' }})"
        file_pattern: data api
        branch: main

    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
